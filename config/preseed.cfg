# ------------------------------------------------------------------------------------------
# File:        preseed.cfg
# Revision:    r10
# Modified:    2026-08-24
# Author:      Andrew J. Moore
# Source:      https://github.com/bobapplemac/debian-netinst-customizer/config/preseed.cfg
# Description: Automated Debian Server installation configuration.
#
#              This preseed is intended for Debian 13 (Trixie) amd64 systems using UEFI.
#              It automates all installation options except:
#
#                - Hostname
#                - Domain name
#                - Root password
#                - Target installation disk
#
#              The root filesystem type (ext4 or XFS) is selected from the ISO boot menu
#              and passed to Debian Installer using:
#
#                partman/default_filesystem=ext4
#                partman/default_filesystem=xfs
#
#              Expected disk layout:
#
#                GPT
#                ├── 1 GiB EFI System Partition
#                └── Remaining space mounted as /
#
#              No swap partition is created. If swap is required, configure a swap file
#              after installation.
#
#              The resulting system:
#
#                - Uses DHCP for initial network configuration
#                - Uses ifupdown (/etc/network/interfaces)
#                - Creates only the root user
#                - Prompts for the root password during installation
#                - Enables SSH password authentication for root
#                - Installs the SSH server and standard system utilities
#                - Uses deb.debian.org as the Debian package mirror
#                - Uses America/New_York as the system time zone
#                - Uses modern deb822-style APT sources (debian.sources)
#                - Reboots automatically when installation completes
#
# ISO Setup:   1. Place this file in the configuration directory used by the ISO build script:
#
#                   config/preseed.cfg
#
#                 The build script adds it to the root of the generated ISO as:
#
#                   /preseed.cfg
#
#              2. Add automated installation entries to the ISO boot menu using:
#
#                   auto=true
#                   priority=high
#                   preseed/file=/cdrom/preseed.cfg
#
#              3. Add one of the following filesystem parameters to each boot entry:
#
#                   partman/default_filesystem=ext4
#
#                 or:
#
#                   partman/default_filesystem=xfs
#
#              Example kernel command line:
#
#                   auto=true priority=high \
#                   preseed/file=/cdrom/preseed.cfg \
#                   partman/default_filesystem=ext4
#
#              Keep the standard Debian Installer boot entry available as a fallback.
#
# Validation:  Check preseed syntax on a Debian system with:
#
#                   debconf-set-selections -c preseed.cfg
#
#              Always test partitioning changes using a disposable VM before deploying
#              to physical systems. The selected target disk is erased automatically.
# ------------------------------------------------------------------------------------------

#_preseed_V1

###############################################################################
# Localization
###############################################################################

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us


###############################################################################
# Network
###############################################################################

# Automatically select an interface and configure it using DHCP.
d-i netcfg/choose_interface select auto
d-i netcfg/use_autoconfig boolean true

# Offer optional 802.1Q VLAN configuration in the custom high-priority install
# path. The default answer is false, so untagged DHCP remains the default.
d-i netcfg/ask_vlan boolean true

# Use traditional /etc/network/interfaces configuration on the installed system.
d-i netcfg/target_network_config select ifupdown

# Ask for the hostname.
#
# Leave the value empty to avoid supplying a static default. Debian Installer
# may still populate the field using information obtained from DHCP or DNS.
d-i netcfg/get_hostname string
d-i netcfg/get_hostname seen false

# To provide a default hostname while still displaying the prompt, use:
#
#   d-i netcfg/get_hostname string debian
#   d-i netcfg/get_hostname seen false
#
# To fully preseed the hostname and suppress the prompt, specify the hostname
# and omit the "seen false" entry.

# Ask for the domain name.
#
# Leave the value empty to avoid supplying a static default. Debian Installer
# may still populate the field using the DHCP domain-name option.
d-i netcfg/get_domain string
d-i netcfg/get_domain seen false

# To provide a default domain while still displaying the prompt, use:
#
#   d-i netcfg/get_domain string example.local
#   d-i netcfg/get_domain seen false
#
# To fully preseed the domain and suppress the prompt, specify the domain
# and omit the "seen false" entry.

# Suppress wireless WEP prompts.
d-i netcfg/wireless_wep string


###############################################################################
# Installer Components
###############################################################################

# Load XFS support in the Debian Installer environment.
# Required for automated installations using an XFS root filesystem.
d-i anna/choose_modules string partman-xfs


###############################################################################
# Firmware
###############################################################################

# Automatically load available firmware if required.
d-i hw-detect/load_firmware boolean true


###############################################################################
# Debian Mirror
###############################################################################

d-i mirror/protocol string http
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string


###############################################################################
# Clock / Time Zone
###############################################################################

# Hardware clock is UTC.
d-i clock-setup/utc boolean true

# Eastern Time.
d-i time/zone string America/New_York

# Synchronize the clock using NTP during installation.
d-i clock-setup/ntp boolean true


###############################################################################
# Accounts
###############################################################################

# Enable the root account.
d-i passwd/root-login boolean true

# Ask for the root password during installation.
#
# The password questions are intentionally not preseeded so that Debian
# Installer prompts for the root password interactively.
#
# To preseed a plaintext root password instead, add both of these entries:
#
#   d-i passwd/root-password password changeme
#   d-i passwd/root-password-again password changeme
#
# Alternatively, a crypt(3) password hash may be supplied instead:
#
#   d-i passwd/root-password-crypted password $6$...
#
# A SHA-512 crypt hash can be generated on Debian with:
#
#   apt install whois
#   mkpasswd -m sha-512
#
# Do not configure both the plaintext password entries and
# passwd/root-password-crypted at the same time.

# Do not create a normal/non-root user.
d-i passwd/make-user boolean false


###############################################################################
# Partitioning
###############################################################################

# Use normal partitions -- no LVM, RAID, or encryption.
d-i partman-auto/method string regular

# IMPORTANT:
#
# Do NOT set either of the following:
#
#   partman-auto/disk
#   partman-auto/select_disk
#
# Leaving the target disk unspecified causes Debian Installer to display
# the "Select disk to partition" dialog.
#
# All data on the selected disk will be erased automatically after selection.

# Always create a GPT partition table.
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt

# Remove old LVM or software RAID metadata without prompting if encountered.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# Custom UEFI partition layout:
#
#   Partition 1: 1024 MB EFI System Partition
#   Partition 2: remainder of disk mounted at /
#
# No /boot partition.
# No swap partition.
#
# The root filesystem is selected through partman/default_filesystem,
# which is supplied by the ISO boot menu as either ext4 or xfs.
d-i partman-auto/expert_recipe string                        \
      boot-root ::                                           \
              1024 1024 1024 free                            \
                      $primary{ }                            \
                      $iflabel{ gpt }                        \
                      $reusemethod{ }                        \
                      method{ efi }                          \
                      format{ }                              \
              .                                              \
              8000 8850 -1 $default_filesystem               \
                      method{ format }                       \
                      format{ }                              \
                      use_filesystem{ }                      \
                      $default_filesystem{ }                 \
                      mountpoint{ / }                        \
              .

# Continue installation without a swap partition.
#
# This setting is intentionally "false": the actual Debian Installer question
# is "Do you want to return to the partitioning menu?"
d-i partman-basicfilesystems/no_swap boolean false

# Mount filesystems by UUID.
d-i partman/mount_style select uuid

# Automatically accept the generated partition table and write it to disk.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
#d-i partman/confirm boolean true
#d-i partman/confirm_nooverwrite boolean true


###############################################################################
# APT
###############################################################################

# Do not retain the installation media as an APT source.
d-i apt-setup/cdrom/set-first boolean false

# Enable Debian's non-free-firmware, contrib, and non-free repositories.
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true

# Enable security and stable-update repositories.
d-i apt-setup/services-select multiselect security, updates


###############################################################################
# Package Selection
###############################################################################

# Install a basic server system with OpenSSH.
tasksel tasksel/first multiselect ssh-server, standard

# Additional packages installed on all systems.
d-i pkgsel/include string \
    parted \
    gdisk \
    btop \
    cron \
    curl \
    chrony \
    xfsprogs \
    inotify-tools

# No unattended automatic-update policy.
d-i pkgsel/update-policy select none

# Bring installed packages up to date during installation.
d-i pkgsel/upgrade select safe-upgrade

# Do not participate in the package usage survey.
popularity-contest popularity-contest/participate boolean false


###############################################################################
# GRUB / UEFI
###############################################################################

# Automatically install GRUB.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# Update UEFI NVRAM boot variables.
d-i grub-installer/update-nvram boolean true


###############################################################################
# Post-Install Configuration
###############################################################################

d-i preseed/late_command string                                                                                                            \
  set -e;                                                                                                                                  \
                                                                                                                                           \
  install -D -o root -g root -m 0644 /cdrom/OEM/debian.sources /target/etc/apt/sources.list.d/debian.sources;                              \
  rm -f /target/etc/apt/sources.list;                                                                                                      \
  in-target apt-get update;                                                                                                                \
                                                                                                                                           \
  printf '%s\n'                                                                                                                            \
      'PermitRootLogin yes'                                                                                                                \
      'PasswordAuthentication yes' |                                                                                                       \
    install -D -o root -g root -m 0644 /dev/stdin /target/etc/ssh/sshd_config.d/99-root-login.conf;                                        \
                                                                                                                                           \
  printf '%s\n'                                                                                                                            \
      'GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT quiet audit=0"' |                                                           \
    install -D -o root -g root -m 0644 /dev/stdin /target/etc/default/grub.d/99-local.cfg;                                                 \
                                                                                                                                           \
  install -d -m 0755 /target/etc/systemd/system-generators;                                                                                \
  ln -sfn /dev/null /target/etc/systemd/system-generators/systemd-ssh-generator;                                                           \
                                                                                                                                           \
  if grep -qiE 'qemu|kvm' /sys/class/dmi/id/sys_vendor 2>/dev/null; then                                                                   \
    in-target apt-get install -y qemu-guest-agent;                                                                                         \
  fi;                                                                                                                                      \
  if grep -qi 'vmware' /sys/class/dmi/id/sys_vendor 2>/dev/null; then                                                                      \
    in-target apt-get install -y open-vm-tools;                                                                                            \
  fi;                                                                                                                                      \
                                                                                                                                           \
  sed -Ei 's/^[[:space:]]*duid([[:space:]].*)?$/#duid/; s/^[[:space:]]*#?[[:space:]]*clientid([[:space:]].*)?$/clientid/'                  \
    /target/etc/dhcpcd.conf; \
  grep -qxF clientid /target/etc/dhcpcd.conf || echo clientid >> /target/etc/dhcpcd.conf;                                                  \
                                                                                                                                           \
  install -D -o root -g root -m 0755 /cdrom/OEM/update-login-banner.sh /target/usr/local/libexec/update-login-banner.sh;                   \
  install -D -o root -g root -m 0644 /cdrom/OEM/update-login-banner.service /target/etc/systemd/system/update-login-banner.service;        \
  in-target systemctl enable update-login-banner.service;                                                                                  \
                                                                                                                                           \
  in-target systemctl disable systemd-timesyncd.service || true;                                                                           \
  in-target systemctl enable chrony.service;                                                                                               \
  in-target systemctl enable fstrim.timer;                                                                                                 \
                                                                                                                                           \
  in-target update-initramfs -u -k all;                                                                                                    \
  in-target update-grub;

###############################################################################
# Finish
###############################################################################

# Reboot automatically when installation is complete.
d-i finish-install/reboot_in_progress note
